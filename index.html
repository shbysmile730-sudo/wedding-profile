 <!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Wedding Profile Book</title>

<style>

html,body{
margin:0;
padding:0;
overflow:hidden;
background:#000;
}

.slider{
display:flex;
width:100vw;
height:100vh;
overflow-x:auto;
scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
}

.slider::-webkit-scrollbar{
display:none;
}

.page{
flex:0 0 100vw;
height:100vh;
scroll-snap-align:start;
}

.page img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.dots{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
z-index:100;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:rgba(255,255,255,0.4);
transition:0.3s;
}

.dot.active{
background:white;
transform:scale(1.4);
}

</style>

</head>

<body>

<div class="slider" id="slider">

<div class="page">
<img src="June 13th 2026 1.png">
</div>

<div class="page">
<img src="June 13th 2026 2.png">
</div>

<div class="page">
<img src="June 13th 2026 3.png">
</div>

<div class="page">
<img src="June 13th 2026 4.png">
</div>

<div class="page">
<img src="June 13th 2026 5.png">
</div>

<div class="page">
<img src="June 13th 2026 6.png">
</div>

</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<script>

const slider=document.getElementById("slider");
const dots=document.querySelectorAll(".dot");

slider.addEventListener("scroll",()=>{

const page=Math.round(
slider.scrollLeft/window.innerWidth
);

dots.forEach(dot=>{
dot.classList.remove("active");
});

if(dots[page]){
dots[page].classList.add("active");
}

});

</script>

</body>
</html>
