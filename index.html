<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

<title>Wedding Profile Book</title>

<style>

html, body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#f8f6f2;
touch-action:pan-x;
}

.slider{
display:flex;
width:100vw;
height:100dvh;
overflow-x:auto;
overflow-y:hidden;
scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
}

.slider::-webkit-scrollbar{
display:none;
}

.page{
flex:0 0 100vw;
height:100dvh;
display:flex;
justify-content:center;
align-items:center;
scroll-snap-align:start;
background:#f8f6f2;
padding-top:8px;
padding-bottom:24px;
box-sizing:border-box;
}

.page img{
max-width:100%;
max-height:96%;
object-fit:contain;
display:block;
}

.dots{
position:fixed;
left:50%;
bottom:10px;
transform:translateX(-50%);
display:flex;
gap:8px;
z-index:999;
}

.dot{
width:7px;
height:7px;
border-radius:50%;
background:rgba(100,100,100,0.25);
transition:0.25s;
}

.dot.active{
background:#666;
transform:scale(1.5);
}

</style>

</head>

<body>

<div class="slider" id="slider">

<div class="page">
<img src="June 13th 2026 1.png">
</div>

<div class="page">
<img src="June 13th 2026 2.png">
</div>

<div class="page">
<img src="June 13th 2026 3.png">
</div>

<div class="page">
<img src="June 13th 2026 4.png">
</div>

<div class="page">
<img src="IMG_2596.png">
</div>

<div class="page">
<img src="June 13th 2026 (席次).png">
</div>

</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<script>

const slider = document.getElementById("slider");
const dots = document.querySelectorAll(".dot");

slider.addEventListener("scroll", () => {

const page = Math.round(
slider.scrollLeft / window.innerWidth
);

dots.forEach(dot => {
dot.classList.remove("active");
});

if(dots[page]){
dots[page].classList.add("active");
}

});

</script>

</body>
</html>
