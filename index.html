<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Wedding Profile Book</title>

<style>

html,body{
margin:0;
padding:0;
overflow:hidden;
background:#000;
font-family:serif;
}

.slider{
display:flex;
width:100vw;
height:100vh;
overflow-x:auto;
scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
}

.slider::-webkit-scrollbar{
display:none;
}

.page{
flex:0 0 100vw;
height:100vh;
scroll-snap-align:start;
position:relative;
}

.page img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.last-page{
background:#f8f6f2;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:30px;
box-sizing:border-box;
}

.last-page h1{
font-size:34px;
margin-bottom:15px;
font-weight:normal;
color:#333;
}

.last-page p{
font-size:18px;
line-height:1.8;
color:#666;
margin-bottom:30px;
}

.last-page img{
width:65%;
max-width:300px;
height:auto;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
}

.last-page .small{
margin-top:25px;
font-size:14px;
color:#999;
}

.dots{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
z-index:100;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:rgba(255,255,255,0.4);
transition:0.3s;
}

.dot.active{
background:white;
transform:scale(1.4);
}

</style>
</head>

<body>

<div class="slider" id="slider">

<div class="page">
<img src="1.png">
</div>

<div class="page">
<img src="2.png">
</div>

<div class="page">
<img src="3.png">
</div>

<div class="page">
<img src="4.png">
</div>

<div class="page">
<img src="5.png">
</div>

<div class="page last-page">

<h1>Thank You</h1>

<p>
本日はお越しいただき<br>
誠にありがとうございます。<br><br>

ぜひ素敵なお写真を<br>
共有してください。
</p>

<img src="photoqr.png">

<div class="small">
Scan the QR code to upload your photos.
</div>

</div>

</div>

<div class="dots">
<div class="dot active"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<script>

const slider=document.getElementById("slider");
const dots=document.querySelectorAll(".dot");

slider.addEventListener("scroll",()=>{

const page=Math.round(
slider.scrollLeft/window.innerWidth
);

dots.forEach(dot=>dot.classList.remove("active"));

if(dots[page]){
dots[page].classList.add("active");
}

});

</script>

</body>
</html>
